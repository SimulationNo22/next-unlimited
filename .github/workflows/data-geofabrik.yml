# Alternative Datenquelle: kompletter Deutschland-Extrakt von Geofabrik (unabhängig von Overpass-Servern)
name: Autobahndaten aktualisieren (Geofabrik)
on:
  schedule:
    - cron: '17 3 * * 1'   # montags 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: osmium installieren
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Deutschland-Extrakt laden (~4,5 GB)
        run: curl -fsSL -o de.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
      - name: Autobahnen herausfiltern
        run: |
          osmium tags-filter de.osm.pbf w/highway=motorway,motorway_link -o mw.osm.pbf
          osmium cat mw.osm.pbf -f opl,add_metadata=false -o mw.opl
          rm de.osm.pbf
      - name: Daten bauen
        run: node scripts/build-data-pbf.mjs mw.opl
      - name: Speichern, falls sich etwas geändert hat
        run: |
          git config user.name "datenbot"
          git config user.email "datenbot@users.noreply.github.com"
          git add app/data
          git diff --cached --quiet || git commit -m "Autobahndaten aktualisiert (Geofabrik)"
          git pull --rebase origin main
          git push
