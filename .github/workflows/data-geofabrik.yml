# Autobahndaten aus dem Geofabrik-Deutschland-Extrakt (unabhängig von Overpass-Servern)
name: Autobahndaten aktualisieren (Geofabrik)
on:
  schedule:
    - cron: '17 3 * * 1'   # montags 03:17 UTC
  workflow_dispatch:
    inputs:
      test:
        description: 'Nur testen (Ergebnis als Download, nichts speichern)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: osmium installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Deutschland-Extrakt laden (~4,5 GB)
        run: curl -fsSL --retry 3 -o de.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf && ls -lh de.osm.pbf
      - name: Autobahnen herausfiltern
        run: |
          osmium tags-filter de.osm.pbf w/highway=motorway,motorway_link -o mw.osm.pbf
          osmium cat mw.osm.pbf -f opl,add_metadata=false -o mw.opl
          rm de.osm.pbf
          ls -lh mw.osm.pbf mw.opl
      - name: Daten bauen
        env:
          OUT_DIR: ${{ inputs.test == true && 'test-out' || 'app/data' }}
          DATA_SOURCE: geofabrik
        run: node scripts/build-data-pbf.mjs mw.opl
      - name: Mit bisherigem Datensatz vergleichen
        if: ${{ inputs.test == true }}
        run: node scripts/compare-data.mjs app/data/de.json test-out/de.json
      - name: Testergebnis bereitstellen
        if: ${{ inputs.test == true }}
        uses: actions/upload-artifact@v4
        with:
          name: geofabrik-test
          path: test-out/
      - name: Speichern, falls sich etwas geändert hat
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "datenbot"
          git config user.email "datenbot@users.noreply.github.com"
          git add app/data
          git diff --cached --quiet || git commit -m "Autobahndaten aktualisiert (Geofabrik)"
          git pull --rebase origin main
          git push
