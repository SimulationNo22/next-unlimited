# Holt jede Woche die aktuellen Autobahn-Tempolimits von OpenStreetMap
# und legt sie als app/data/de.json ab. Netlify veröffentlicht die neue Version danach automatisch.
# Reserve: alter Weg über Overpass-Server (nur noch per Knopfdruck). Standard ist data-geofabrik.yml.
name: Autobahndaten aktualisieren (Overpass, Reserve)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten bauen
        run: node scripts/build-data.mjs
      - name: Speichern, falls sich etwas geändert hat
        run: |
          git config user.name "datenbot"
          git config user.email "datenbot@users.noreply.github.com"
          git add app/data
          git diff --cached --quiet || git commit -m "Autobahndaten aktualisiert"
          git pull --rebase origin main
          git push
