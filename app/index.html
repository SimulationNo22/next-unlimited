<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Next Unlimited">
<title>Next Unlimited</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ START ============ -->
<section id="start" class="screen active">
  <div class="lang" role="group" aria-label="Sprache / Language">
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <div class="logo">
    <div class="logo-inset">
      <svg viewBox="0 0 150 150" class="logo-svg" role="img" aria-label="Next Unlimited Logo">
        <defs>
          <linearGradient id="hotS" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd27f"/><stop offset="0.5" stop-color="#ff7a26"/><stop offset="1" stop-color="#e8480f"/>
          </linearGradient>
          <filter id="blurS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
          <radialGradient id="fadeS" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fff"/><stop offset="0.72" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
          </radialGradient>
          <mask id="maskS" maskUnits="userSpaceOnUse" x="0" y="0" width="150" height="150"><circle cx="75" cy="75" r="75" fill="url(#fadeS)"/></mask>
        </defs>
        <ellipse cx="75" cy="25" rx="30" ry="25" fill="url(#glowGrad)" opacity="0.55"/>
        <polygon points="75,9 86,31 64,31" fill="url(#hotS)" stroke="url(#hotS)" stroke-width="7" stroke-linejoin="round" filter="url(#fGlow1)"/>
        <use href="#sign" x="19.7" y="19.7" width="110.6" height="110.6" filter="url(#fSign)"/>
      </svg>
    </div>
  </div>

  <div class="title">
    <h1>Next Unlimited</h1>
    <p data-t="subtitle"></p>
  </div>

  <div class="card inset">
    <span class="kicker" data-t="notice"></span>
    <p data-t="p1"></p>
    <p data-t="p2"></p>
  </div>

  <div class="datastate">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="#ff8a3d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="dataState"></span>
  </div>

  <p id="iosHint" class="ioshint hidden" data-t="iosHint"></p>
  <button type="button" id="go" class="go">OK, let’s go</button>
  <a id="demoLink" class="demolink" href="?demo" data-t="demo"></a>
</section>

<!-- ============ FAHRT ============ -->
<section id="drive" class="screen">
  <header class="top">
    <div class="road">
      <span id="ref" class="badge">A</span>
      <span id="dirText"></span>
    </div>
    <div class="gps inset-pill"><span id="gpsDot" class="dot"></span>GPS</div>
    <a id="demoEnd" class="demo-end hidden" href="./" data-t="demoEnd"></a>
  </header>

  <div class="dial" id="dial">
    <div class="d-outer"></div>
    <div class="d-track"></div>
    <div class="d-hub"></div>
    <svg viewBox="0 0 340 340" class="d-svg" role="img" id="dialSvg" aria-label="">
      <defs>
        <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd27f"/><stop offset="0.5" stop-color="#ff7a26"/><stop offset="1" stop-color="#e8480f"/>
        </linearGradient>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e8480f"/>
        </linearGradient>
        <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
        <radialGradient id="fadeD" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff"/><stop offset="0.75" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
        </radialGradient>
<radialGradient id="rg0" gradientUnits="userSpaceOnUse" cx="170" cy="47" r="72"><stop offset="0" stop-color="#ffb070" stop-opacity="0.8"/><stop offset="0.4" stop-color="#ff8a3d" stop-opacity="0.42"/><stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/></radialGradient>
        <radialGradient id="rg1" gradientUnits="userSpaceOnUse" cx="170" cy="47" r="72"><stop offset="0" stop-color="#ffb070" stop-opacity="0.8"/><stop offset="0.4" stop-color="#ff8a3d" stop-opacity="0.42"/><stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/></radialGradient>
        <radialGradient id="rg2" gradientUnits="userSpaceOnUse" cx="170" cy="47" r="72"><stop offset="0" stop-color="#ffb070" stop-opacity="0.8"/><stop offset="0.4" stop-color="#ff8a3d" stop-opacity="0.42"/><stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/></radialGradient>
        <radialGradient id="rgHub" gradientUnits="userSpaceOnUse" cx="170" cy="170" r="132"><stop offset="0.8" stop-color="#ff8a3d" stop-opacity="0.75"/><stop offset="1" stop-color="#ff6b1f" stop-opacity="0.35"/></radialGradient>
                <mask id="maskD" maskUnits="userSpaceOnUse" x="0" y="0" width="340" height="340"><circle cx="170" cy="170" r="128" fill="url(#fadeD)"/></mask>
        <path id="bezTop" d="M170,304 A134,134 0 1,1 170,36 A134,134 0 1,1 170,304" fill="none"/>
        <path id="bezBot" d="M170,23 A147,147 0 1,0 170,317 A147,147 0 1,0 170,23" fill="none"/>
      </defs>
      <circle cx="170" cy="170" r="118" fill="none" stroke="#44484f" stroke-width="8" stroke-dasharray="1.6 8.697"/>
      <!-- Lichtreflexe: das Leuchten der Nadeln fällt auf Skala und Innenwand der Hohlkehle -->
      <g id="reflect">
        <g class="refl" id="refl2"><circle cx="170" cy="170" r="118" fill="none" stroke="url(#rg2)" stroke-width="8" stroke-dasharray="1.6 8.697"/><circle cx="170" cy="170" r="122" fill="none" stroke="url(#rg2)" stroke-width="12" opacity="0.12"/><circle cx="170" cy="170" r="127" fill="none" stroke-width="2" stroke="url(#rg2)"/></g>
        <g class="refl" id="refl1"><circle cx="170" cy="170" r="118" fill="none" stroke="url(#rg1)" stroke-width="8" stroke-dasharray="1.6 8.697"/><circle cx="170" cy="170" r="122" fill="none" stroke="url(#rg1)" stroke-width="12" opacity="0.12"/><circle cx="170" cy="170" r="127" fill="none" stroke-width="2" stroke="url(#rg1)"/></g>
        <g class="refl" id="refl0"><circle cx="170" cy="170" r="118" fill="none" stroke="url(#rg0)" stroke-width="8" stroke-dasharray="1.6 8.697"/><circle cx="170" cy="170" r="122" fill="none" stroke="url(#rg0)" stroke-width="12" opacity="0.12"/><circle cx="170" cy="170" r="127" fill="none" stroke-width="2" stroke="url(#rg0)"/></g>
        <g class="refl-hub"><circle cx="170" cy="170" r="118" fill="none" stroke="url(#rgHub)" stroke-width="8" stroke-dasharray="1.6 8.697"/><circle cx="170" cy="170" r="122" fill="none" stroke="url(#rgHub)" stroke-width="12" opacity="0.12"/><circle cx="170" cy="170" r="127" fill="none" stroke-width="2" stroke="url(#rgHub)"/></g>
      </g>

      <g id="ringGroup" class="off">
        <circle id="groove" cx="170" cy="170" r="139" fill="none" stroke="#08090a" stroke-width="15" stroke-linecap="round" stroke-dasharray="0 873.4" transform="rotate(-90 170 170)"/>
        <circle id="grooveHi" cx="170" cy="170" r="146.5" fill="none" stroke="#2a2d32" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0 920.4" transform="rotate(-90 170 170)" opacity="0.8"/>
        <circle id="grooveLo" cx="170" cy="170" r="131.5" fill="none" stroke="#040405" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0 826.2" transform="rotate(-90 170 170)" opacity="0.9"/>

      </g>

      <ellipse id="floor2" class="floor" cx="170" cy="58" rx="24" ry="30" fill="url(#glowGrad)" style="opacity:0"/>
      <ellipse id="floor1" class="floor" cx="170" cy="58" rx="24" ry="30" fill="url(#glowGrad)" style="opacity:0"/>
      <ellipse id="floor0" class="floor" cx="170" cy="58" rx="24" ry="30" fill="url(#glowGrad)" style="opacity:0"/>
      <ellipse id="glow2" cx="170" cy="101" rx="30" ry="26" fill="url(#glowGrad)" opacity="0"/>
      <ellipse id="glow1" cx="170" cy="100" rx="33" ry="28" fill="url(#glowGrad)" opacity="0"/>
      <ellipse id="glow0" cx="170" cy="98" rx="38" ry="32" fill="url(#glowGrad)" opacity="0"/>
      <circle id="hubGlow" cx="170" cy="170" r="105" fill="url(#hubGlowGrad)" opacity="0"/>
      <g id="nd2" class="needle off"><polygon class="dark" points="170,86 183,113 157,113" fill="url(#unlitGrad)" stroke="url(#unlitGrad)" stroke-width="7" stroke-linejoin="round" filter="url(#fUnlit)"/><polygon class="ember" points="170,86 183,113 157,113" fill="url(#emberGrad)" stroke="url(#emberGrad)" stroke-width="7" stroke-linejoin="round"/><polygon class="lit" points="170,86 183,113 157,113" fill="#b04a18" stroke="#b04a18" stroke-width="7" stroke-linejoin="round" filter="url(#fGlow3)"/></g>
      <g id="nd1" class="needle off"><polygon class="dark" points="170,86 183,113 157,113" fill="url(#unlitGrad)" stroke="url(#unlitGrad)" stroke-width="7" stroke-linejoin="round" filter="url(#fUnlit)"/><polygon class="ember" points="170,86 183,113 157,113" fill="url(#emberGrad)" stroke="url(#emberGrad)" stroke-width="7" stroke-linejoin="round"/><polygon class="lit" points="170,86 183,113 157,113" fill="#e2611f" stroke="#e2611f" stroke-width="7" stroke-linejoin="round" filter="url(#fGlow2)"/></g>
      <g id="nd0" class="needle off"><polygon class="dark" points="170,86 183,113 157,113" fill="url(#unlitGrad)" stroke="url(#unlitGrad)" stroke-width="7" stroke-linejoin="round" filter="url(#fUnlit)"/><polygon class="ember" points="170,86 183,113 157,113" fill="url(#emberGrad)" stroke="url(#emberGrad)" stroke-width="7" stroke-linejoin="round"/><polygon class="lit" points="170,86 183,113 157,113" fill="url(#hot)" stroke="url(#hot)" stroke-width="7" stroke-linejoin="round" filter="url(#fGlow1)"/></g>
      <g id="ringHead" class="head off"><polygon id="headTri" points="170,86 183,113 157,113" fill="url(#hot)" stroke="url(#hot)" stroke-width="7" stroke-linejoin="round" filter="url(#fGlow1)"/><circle id="headBall" cx="170" cy="104.7" r="13" fill="#ff8a3d" filter="url(#fGlow1)" style="opacity:0"/></g>

      <use href="#sign" x="104" y="104" width="132" height="132" id="hubSign" filter="url(#fSign)"/>

      <text class="bez bez0" filter="url(#fBez0)"><textPath id="lbl0" href="#bezTop" startOffset="50%" text-anchor="middle"></textPath></text>
      <text class="bez bez1" filter="url(#fBez1)"><textPath id="lbl1" href="#bezTop" startOffset="50%" text-anchor="middle"></textPath></text>
      <text class="bez bez2"><textPath id="lbl2" href="#bezTop" startOffset="50%" text-anchor="middle"></textPath></text>
    </svg>
    <div class="ring-conic-wrap" id="ringConicWrap"><canvas id="ringCanvas"></canvas></div>
    <div class="medal" id="medal" aria-hidden="true">
      <div class="medal-inner" id="medalInner">
        <div class="medal-face front"><svg viewBox="0 0 100 100"><use href="#sign"/></svg></div>
        <div class="medal-face back"><svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="47" fill="url(#signFace)" stroke="#1d1f23" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="42.5" fill="none" stroke="#131416" stroke-width="3"/>
          <text x="50" y="52" text-anchor="middle" dominant-baseline="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="40" letter-spacing="-1.5" fill="#111214">22</text>
        </svg></div>
      </div>
    </div>
  </div>

  <div class="info">
  <div class="readout">
    <div class="big">
      <span id="bigPre" class="pre"></span>
      <span id="bigNum" class="num">--</span>
      <span id="bigUnit" class="unit">km</span>
    </div>
    <span id="bigLabel" class="label"></span>
  </div>


  <div id="warn" class="warn inset idle">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L22 20 H2 Z" fill="none" stroke="#ffb347" stroke-width="2" stroke-linejoin="round"/><path d="M12 10 V14" stroke="#ffb347" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="#ffb347"/></svg>
    <span id="warnText"></span>
  </div>

  </div>

  <div class="bottom raised">
    <div class="speed"><span id="speed">--</span><span class="u">km/h</span></div>
    <div class="limit"><span class="l-lbl">Limit</span><span id="limitSign" class="limitsign none-known">–</span></div>
  </div>
</section>

<!-- Gemeinsames Schild (Zeichen 282, stilisiert) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="signFace" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f6f7f8"/><stop offset="1" stop-color="#c3c7cc"/>
    </radialGradient>
    <linearGradient id="unlitGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4538"/><stop offset="0.5" stop-color="#3b2d26"/><stop offset="1" stop-color="#211b18"/></linearGradient>
    <linearGradient id="emberGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2481a"/><stop offset="1" stop-color="#6e2410"/></linearGradient>
    <filter id="fUnlit" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/></filter>
    <clipPath id="signClip"><circle cx="50" cy="50" r="40"/></clipPath>
    <radialGradient id="glowGrad"><stop offset="0" stop-color="#ff7a26" stop-opacity="0.95"/><stop offset="0.45" stop-color="#ff6b1f" stop-opacity="0.45"/><stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="hubGlowGrad"><stop offset="0.55" stop-color="#ff6b1f" stop-opacity="0.75"/><stop offset="0.68" stop-color="#ff6b1f" stop-opacity="0.42"/><stop offset="0.82" stop-color="#ff6b1f" stop-opacity="0.15"/><stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/></radialGradient>
    <filter id="fGlow1" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff6b1f" flood-opacity="0.75"/></filter>
    <filter id="fGlow2" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff6b1f" flood-opacity="0.5"/></filter>
    <filter id="fGlow3" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#ff6b1f" flood-opacity="0.3"/></filter>
    <filter id="fSign" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0f1012" flood-opacity="0.85"/></filter>
    <filter id="fBez0" x="-30%" y="-80%" width="160%" height="260%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff6b1f" flood-opacity="0.8"/></filter>
    <filter id="fBez1" x="-30%" y="-80%" width="160%" height="260%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#ff6b1f" flood-opacity="0.45"/></filter>
    <linearGradient id="barTip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a26"/><stop offset="1" stop-color="#ffd27f"/></linearGradient>
    <linearGradient id="gi1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27f"/><stop offset="0.5" stop-color="#ff7a26"/><stop offset="1" stop-color="#e2611f"/></linearGradient>
    <linearGradient id="gi2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98a55"/><stop offset="1" stop-color="#b04a18"/></linearGradient>
    <symbol id="sign" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" fill="url(#signFace)" stroke="#1d1f23" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="42.5" fill="none" stroke="#131416" stroke-width="3"/>
      <g clip-path="url(#signClip)"><g transform="rotate(-45 50 50)" fill="#131416">
        <rect x="0" y="35" width="100" height="3.6"/><rect x="0" y="41.6" width="100" height="3.6"/>
        <rect x="0" y="48.2" width="100" height="3.6"/><rect x="0" y="54.8" width="100" height="3.6"/>
        <rect x="0" y="61.4" width="100" height="3.6"/>
      </g></g>
    </symbol>
  </defs>
</svg>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
